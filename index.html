<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS Strumenti</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Strumenti per la gestione dei concorsi: ricevute, abbinamenti, controlli e altro.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="color-scheme" content="light dark">
<script>/* tema e stile scelti in precedenza (js/tema.js, js/stile.js), applicati subito per evitare il lampo */document.documentElement.dataset.stile='vetro';try{var t=localStorage.getItem('cs-tema');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;if(localStorage.getItem('cs-stile')==='classico')document.documentElement.dataset.stile='classico'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Titillium+Web:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/struttura.css">
<link rel="stylesheet" href="css/scrivania.css">
<link rel="stylesheet" href="css/assistente.css">
<link rel="stylesheet" href="css/vetro.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<canvas id="campo" class="campo" aria-hidden="true"></canvas>
<div class="sfondo-logo" aria-hidden="true"></div>
<div class="pagina">
  <div class="velo" aria-hidden="true"><div class="sfondo-logo"></div></div>
  <header class="testata">
    <div class="barra-alta">
      <a class="marchio" href="#" aria-label="CS Strumenti, vai alla scrivania">
        <span class="marchio-segno logo-cs" aria-hidden="true"></span>
        <span class="marchio-nome">CS Strumenti</span>
      </a>
      <nav class="pillole" id="pillole" aria-label="Funzioni"></nav>
      <div class="testata-azioni">
        <div class="nuovo">
          <button class="btn primary piccolo" id="nuovo" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Nuovo: apri una funzione" title="Apri una funzione"><span aria-hidden="true">+</span><span class="nuovo-testo" aria-hidden="true">Nuovo</span></button>
          <div class="menu-pop" id="menu-nuovo" role="menu" hidden></div>
        </div>
        <button class="stile-btn" id="stile" type="button" aria-label="Stile vetro"></button>
        <div class="tema" id="tema" role="group" aria-label="Tema dei colori"></div>
        <a class="campanella" id="campanella" href="#" title="Da fare" aria-label="Da fare">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8.5a5 5 0 0 1 10 0c0 4 1.6 5.3 1.6 5.3H3.4S5 12.5 5 8.5zM8.2 16.6a2 2 0 0 0 3.6 0"/></svg>
          <span class="bollino" id="bollino" hidden></span>
        </a>
        <div class="profilo">
          <button class="avatar" id="avatar" type="button" aria-haspopup="dialog" aria-expanded="false" title="Il tuo nome">?</button>
          <div class="menu-pop profilo-pop" id="profilo-pop" hidden>
            <label for="profilo-nome">Come ti chiami?</label>
            <input id="profilo-nome" autocomplete="given-name" placeholder="es. Riccardo" maxlength="40">
            <small>Serve solo per salutarti: resta in questo browser.</small>
          </div>
        </div>
      </div>
    </div>
    <div class="barra-bassa">
      <nav class="briciole" id="briciole" aria-label="Percorso"></nav>
      <nav class="schede" id="schede" aria-label="Sezioni"></nav>
      <span class="stato-banco" title="I file e i dati non vengono inviati a nessun server"><span class="pallino" aria-hidden="true"></span><span class="dove">Tutto resta in questo browser ·</span><time id="ora"></time></span>
    </div>
  </header>

  <main id="app" class="app">
    <div id="vista" class="vista"></div>
  </main>
</div>

<aside id="assistente" class="assistente" aria-label="Assistente" hidden>
  <div class="ass-testa">
    <span class="ass-segno" aria-hidden="true"></span>
    <div class="ass-intest"><strong>Assistente</strong><span id="ass-contesto"></span></div>
    <button class="ass-chiudi" id="ass-chiudi" type="button" aria-label="Chiudi l'assistente">&times;</button>
  </div>
  <ol class="ass-puntini" id="ass-puntini" aria-hidden="true"></ol>
  <p class="ass-contatore" id="ass-contatore"></p>
  <h3 class="ass-titolo" id="ass-titolo"></h3>
  <div class="ass-testo" id="ass-testo"></div>
  <p class="ass-attesa" id="ass-attesa" hidden><span class="ass-pulsa" aria-hidden="true"></span>Vado avanti da solo quando hai fatto.</p>
  <div class="ass-azioni">
    <button class="btn" id="ass-indietro" type="button">Indietro</button>
    <button class="btn primary" id="ass-avanti" type="button">Avanti</button>
  </div>
</aside>

<div class="avviso" id="avviso" role="status" aria-live="polite" hidden></div>
<noscript><p class="noscript">Per usare CS Strumenti serve JavaScript attivo nel browser.</p></noscript>
</body>
</html>
